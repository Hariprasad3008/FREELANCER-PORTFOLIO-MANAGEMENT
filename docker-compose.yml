version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: freelancer_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: freelancer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancer_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/freelancer_db
      JWT_SECRET: super_secret_jwt_key_freelancer_marketplace_2026_secure
      CLIENT_URL: http://localhost:5000
    depends_on:
      - db

volumes:
  postgres_data:
